[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "burgers_rom"
version = "0.1.0"
description = "Reduced-order models (POD/sPOD-Galerkin) for the 1D Burgers' equation"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.20",
    "scipy>=1.8",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.5"]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]
